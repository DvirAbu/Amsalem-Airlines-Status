<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סטטוס חברות תעופה - אמסלם</title>

    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L2YBE8GECL"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        // מזהה המדידה של גוגל אנליטיקס מעודכן כאן
        gtag('config', 'G-L2YBE8GECL');

        function trackEvent(eventName, eventParams) {
            if (typeof gtag === 'function') {
                gtag('event', eventName, eventParams);
            }
        }
    </script>

    <!-- Tailwind CSS CDN (מומלץ להחליף בתהליך Build של Tailwind בסביבת ייצור) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Modern Aero Glass Theme Variables */
            --primary: #1bb0ce;
            --primary-hover: #1598b3;
            --primary-gradient: linear-gradient(135deg, #1bb0ce 0%, #3b82f6 100%);
            
            --bg-main: #eff6ff; 
            --bg-card: rgba(255, 255, 255, 0.75);
            --text-main: #0f172a;
            --text-muted: #475569;
            --border: rgba(255, 255, 255, 0.6);
            
            --topbar-bg: rgba(255, 255, 255, 0.85);
            --glass-shadow: 0 10px 40px -10px rgba(31, 38, 135, 0.08);
            
            --highlight-bg: #fef08a;
            --highlight-text: #854d0e;
        }

        [data-theme="dark"] {
            /* Dark Glass Theme */
            --bg-main: #020617;
            --bg-card: rgba(30, 41, 59, 0.65);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            
            --topbar-bg: rgba(15, 23, 42, 0.85);
            --glass-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
            
            --highlight-bg: #ca8a04;
            --highlight-text: #fefce8;
        }

        body {
            font-family: 'Heebo', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            transition: background-color 0.5s ease, color 0.5s ease;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Glowing Blobs */
        body::before, body::after {
            content: ''; position: fixed; width: 60vw; height: 60vh; border-radius: 50%;
            z-index: -1; filter: blur(100px); opacity: 0.5; pointer-events: none;
            transition: background 0.5s ease;
        }
        body::before { top: -20%; left: -10%; background: radial-gradient(circle, rgba(27, 176, 206, 0.2) 0%, transparent 70%); }
        body::after { bottom: -20%; right: -10%; background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%); }
        [data-theme="dark"] body::before { background: radial-gradient(circle, rgba(27, 176, 206, 0.15) 0%, transparent 70%); opacity: 0.3; }
        [data-theme="dark"] body::after { background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 70%); opacity: 0.3; }

        /* Floating Top Navigation */
        .top-bar {
            background-color: var(--topbar-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 15px;
            z-index: 50;
            box-shadow: var(--glass-shadow);
            border-radius: 100px;
            max-width: 1400px;
            margin: 0 auto 30px auto;
            width: 95%;
            transition: all 0.3s ease;
        }

        .brand-logo img { 
            height: 50px; 
            object-fit: contain; 
            transition: transform 0.3s, filter 0.3s ease; 
        }
        .brand-logo img:hover { transform: scale(1.05); }
        
        /* Apply a filter to the logo in dark mode to make the dark grey text visible */
        [data-theme="dark"] .brand-logo img {
            filter: brightness(0) invert(1) brightness(0.8); 
            /* 
               brightness(0) makes it black, 
               invert(1) makes it white, 
               brightness(0.8) softens the stark white slightly 
            */
        }
        
        .header-actions { display: flex; align-items: center; gap: 12px; }

        .theme-toggle, .lang-toggle {
            background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main);
            padding: 10px 20px; border-radius: 50px; font-weight: 700; font-size: 0.95rem; 
            cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        
        .theme-toggle { padding: 10px 15px; }
        .theme-toggle:hover, .lang-toggle:hover {
            transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.08);
            border-color: var(--primary); color: var(--primary);
        }

        /* Dashboard Hero Section */
        .hero-section {
            text-align: center !important;
            padding: 40px 20px 20px;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .header-content { text-align: center !important; margin: 0; }
        .header-title {
            font-size: 3.5rem; font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin: 0; line-height: 1.1; letter-spacing: -1px;
        }
        
        .subtitle-badge { 
            display: inline-flex; align-items: center; gap: 8px;
            background: var(--bg-card); backdrop-filter: blur(10px);
            border: 1px solid var(--border); padding: 8px 20px; 
            border-radius: 100px; box-shadow: var(--glass-shadow);
            color: var(--text-muted); font-size: 1rem; font-weight: 600; 
        }

        .main-container { max-width: 1400px; margin: 0 auto; padding: 0 20px 60px; }

        /* Search & Filters */
        .controls-wrapper {
            display: flex; flex-direction: column; align-items: center; gap: 20px;
            max-width: 700px; margin: 0 auto 50px auto; width: 100%;
        }

        .search-box { position: relative; width: 100%; }
        .search-box input {
            width: 100%; padding: 22px 60px 22px 25px; /* Right padding for icon in RTL */
            border-radius: 100px; border: 2px solid transparent; 
            background-color: var(--bg-card); backdrop-filter: blur(16px);
            color: var(--text-main); font-family: 'Heebo', sans-serif; font-size: 1.15rem;
            transition: all 0.3s ease; box-shadow: var(--glass-shadow);
        }
        [dir="ltr"] .search-box input { padding: 22px 25px 22px 60px; } /* Adjust for LTR */
        
        .search-box input:focus {
            outline: none; border-color: var(--primary); 
            box-shadow: 0 0 0 6px rgba(27, 176, 206, 0.15), var(--glass-shadow);
        }
        .search-icon {
            position: absolute; inset-inline-start: 25px; top: 50%; transform: translateY(-50%); 
            color: var(--primary); font-size: 1.4rem; pointer-events: none;
        }

        mark { background-color: var(--highlight-bg); color: var(--highlight-text); padding: 0 4px; border-radius: 6px; font-weight: 800; }

        .filters {
            display: inline-flex; gap: 8px; background: var(--bg-card); backdrop-filter: blur(10px);
            padding: 8px; border-radius: 100px; border: 1px solid var(--border);
            box-shadow: var(--glass-shadow); flex-wrap: wrap; justify-content: center;
        }

        .filter-btn {
            background: transparent; color: var(--text-muted); border: none;
            padding: 10px 28px; border-radius: 100px; font-weight: 700; font-size: 1rem;
            cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px;
        }

        .filter-btn:hover { color: var(--text-main); }
        .filter-btn.active { background: var(--text-main); color: var(--bg-main); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        [data-theme="dark"] .filter-btn.active { color: #020617; } /* Keep dark text on bright pill in dark mode */

        /* Sections & Grid */
        .alliance-section { margin-bottom: 60px; animation: slideUpFade 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .alliance-title {
            font-size: 1.6rem; font-weight: 800; color: var(--text-main); 
            display: flex; align-items: center; gap: 15px; margin-bottom: 30px;
            letter-spacing: -0.5px; padding-inline-start: 10px;
        }
        
        .alliance-title::after { content: ''; flex-grow: 1; height: 2px; background: linear-gradient(90deg, var(--border) 0%, transparent 100%); }
        [dir="ltr"] .alliance-title::after { background: linear-gradient(270deg, var(--border) 0%, transparent 100%); }

        .highlight-section .alliance-title { color: #d97706; }
        .highlight-section .alliance-title::after { background: linear-gradient(90deg, #d97706 0%, transparent 100%); opacity: 0.3; }
        [dir="ltr"] .highlight-section .alliance-title::after { background: linear-gradient(270deg, #d97706 0%, transparent 100%); }
        [data-theme="dark"] .highlight-section .alliance-title { color: #f59e0b; }

        /* The Grid */
        .dashboard-list { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
            gap: 24px; 
        }

        /* Glass Cards */
        .airline-card {
            background-color: var(--bg-card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-radius: 24px; padding: 24px; border: 1px solid var(--border);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            display: flex; flex-direction: column; align-items: stretch; justify-content: space-between; 
            box-shadow: var(--glass-shadow); position: relative; gap: 24px; z-index: 1;
        }

        .airline-card:hover { 
            transform: translateY(-6px) scale(1.02); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15); 
            border-color: rgba(27, 176, 206, 0.4);
            z-index: 2;
        }
        [data-theme="dark"] .airline-card:hover { border-color: rgba(255, 255, 255, 0.2); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6); }

        .card-header { display: flex; align-items: center; gap: 18px; }

        .airline-logo-container {
            width: 65px; height: 65px; background-color: #ffffff; border-radius: 18px; 
            display: flex; align-items: center; justify-content: center; 
            padding: 6px; flex-shrink: 0; box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            border: 1px solid rgba(0,0,0,0.05);
        }
        
        .airline-real-logo { width: 100%; height: 100%; object-fit: contain; }
        .airline-logo-fallback { font-weight: 800; font-size: 1.2rem; color: #0f172a; }

        .airline-info { flex-grow: 1; }
        .airline-info h3 { font-size: 1.3rem; font-weight: 800; margin: 0 0 4px 0; color: var(--text-main); line-height: 1.2; letter-spacing: -0.5px; }
        .airline-info p { color: var(--text-muted); font-size: 0.95rem; margin: 0; display: flex; align-items: center; gap: 6px; font-weight: 600; }

        /* Solid Glowing Pill Badges */
        .status-badge {
            padding: 14px 20px; border-radius: 16px; display: flex; align-items: center; justify-content: center; 
            gap: 12px; font-weight: 700; font-size: 1.05rem; width: 100%; color: #ffffff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.15); transition: all 0.3s ease;
        }

        .theme-active .status-badge { background: linear-gradient(135deg, #10b981 0%, #059669 100%); box-shadow: 0 6px 20px -4px rgba(16, 185, 129, 0.4); }
        .theme-soon .status-badge { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); box-shadow: 0 6px 20px -4px rgba(245, 158, 11, 0.4); }
        .theme-suspended .status-badge { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); box-shadow: 0 6px 20px -4px rgba(239, 68, 68, 0.4); }
        .theme-inactive .status-badge { background: linear-gradient(135deg, #64748b 0%, #475569 100%); box-shadow: 0 6px 20px -4px rgba(100, 116, 139, 0.4); }

        .status-icon { font-size: 1.2rem; }

        .status-pulse {
            display: inline-block; width: 12px; height: 12px; border-radius: 50%; background-color: #ffffff;
            box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.6); animation: pulse 2s infinite; flex-shrink: 0;
        }

        @keyframes pulse { 
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.6); } 
            70% { transform: scale(1.1); box-shadow: 0 0 0 8px rgba(255, 255, 255, 0); } 
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); } 
        }

        .no-results {
            text-align: center; padding: 80px 20px; background-color: var(--bg-card); backdrop-filter: blur(10px);
            border-radius: 30px; border: 2px dashed var(--border); display: none; margin-top: 40px; box-shadow: var(--glass-shadow);
        }
        .no-results i { font-size: 3rem; color: var(--text-muted); margin-bottom: 20px; opacity: 0.5; }

        @media (max-width: 768px) {
            .header-title { font-size: 2.5rem; }
            .top-bar { padding: 12px 16px; border-radius: 20px; flex-direction: row; flex-wrap: wrap; gap: 10px; }
            .brand-logo img { height: 40px; }
            .theme-toggle span, .lang-toggle span { display: none; } /* Hide text on very small screens for buttons */
            .theme-toggle { padding: 10px; }
            .lang-toggle { padding: 10px 15px; }
            .dashboard-list { grid-template-columns: 1fr; } /* Stack on mobile */
            .search-box input { padding: 18px 50px 18px 20px; font-size: 1rem; }
            [dir="ltr"] .search-box input { padding: 18px 20px 18px 50px; }
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="brand-logo">
            <img src="Amsalem_Logo.png (2).png" alt="Amsalem Global Travel Management" loading="lazy">
        </div>
        <div class="header-actions">
            <!-- נוסף aria-label לשיפור נגישות -->
            <button id="themeToggle" class="theme-toggle" onclick="toggleTheme()" aria-label="החלף מצב תצוגה / Toggle Theme" title="החלף מצב תצוגה">
                <i class="fa-solid fa-moon" id="themeIcon" aria-hidden="true"></i>
            </button>
            <button id="langToggle" class="lang-toggle" onclick="toggleLanguage()">
                <span>English</span> <i class="fa-solid fa-globe" aria-hidden="true"></i>
            </button>
        </div>
    </header>

    <main class="main-container">
        <!-- New Hero Section -->
        <div class="hero-section">
            <div class="header-content">
                <h1 class="header-title">סטטוס חברות תעופה</h1>
            </div>
            <p class="subtitle-badge"><i class="fa-regular fa-clock" aria-hidden="true"></i> <span id="subtitleText"></span></p>
        </div>

        <!-- Controls Wrap -->
        <div class="controls-wrapper">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon" aria-hidden="true"></i>
                <input type="text" id="searchInput" autocomplete="off" placeholder="חיפוש חברת תעופה או קוד IATA...">
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="all"><span id="txtFilterAll">הכל</span> <i class="fa-solid fa-list-ul ms-2"></i></button>
                <button class="filter-btn" data-filter="active"><span id="txtFilterActive">פעילות</span> <i class="fa-solid fa-circle-check ms-2"></i></button>
            </div>
        </div>

        <!-- הוספת aria-live על מנת שקורא מסך יכריז על שינויים בתוצאות החיפוש -->

                <p>נסה לשנות את מילות החיפוש או את הסינון.</p>
            </div>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script>
        const CONFIG = {
            todayISO: '2026-08-22',
            updatedDate: '22/08/2026',
            updatedTime: '08:30'
        };

        const I18N = {
            he: {

        let currentLang = 'he';
        let currentTheme = 'light';

        function toggleTheme() {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
            const icon = document.getElementById('themeIcon');
            if (currentTheme === 'dark') {
                icon.className = 'fa-solid fa-sun';
            } else {
                icon.className = 'fa-solid fa-moon';
            }
            trackEvent('toggle_theme', { theme_selected: currentTheme });
        }

        function toggleLanguage() {
            currentLang = currentLang === 'he' ? 'en' : 'he';
            const strings = I18N[currentLang];

            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'he' ? 'rtl' : 'ltr';

            document.querySelector('.header-title').innerText = strings.title;
            document.getElementById('subtitleText').innerText = strings.subtitle;

            document.getElementById('searchInput').placeholder = strings.searchPlaceholder;

            document.getElementById('txtFilterActive').innerText = strings.filterActive;

            document.querySelector('#noResults h3').innerText = strings.noResultsTitle;
            document.querySelector('#noResults p').innerText = strings.noResultsDesc;

            const langBtn = document.getElementById('langToggle');
            langBtn.innerHTML = `${strings.langToggle} <i class="fa-solid fa-globe"></i>`;

            if(window.innerWidth > 768) {
                document.querySelector('.header-content').style.textAlign = currentLang === 'en' ? 'left' : 'right';
            }

            applyFilters();
            
            trackEvent('toggle_language', { language_selected: currentLang });
        }

            { id: "as", title: "אסיה והקווקז", titleEn: "Asia & Caucasus" }
        ];

        const AIRLINES = [
            { name: "אל על", nameEn: "El Al", iata: "LY", status: "active", region: "il" },
            { name: "ישראייר", nameEn: "Israir", iata: "6H", status: "active", region: "il" },
            { name: "ארקיע", nameEn: "Arkia", iata: "IZ", status: "active", region: "il" },
            { name: "אייר חיפה", nameEn: "Air Haifa", iata: "E2", status: "active_haifa", region: "il", customLogo: "air_haifa_logo.png" },
            { name: "וואן קליק איירווייז", nameEn: "One Click Airways", iata: "4L", status: "active", region: "we_eu", customLogo: "oneclick-airways-logo-alt.png" },
            { name: "אג'יאן איירליינס", nameEn: "Aegean Airlines", iata: "A3", status: "active", region: "gr_cy" },
            { name: "אוזבקיסטן איירוייז", nameEn: "Uzbekistan Airways", iata: "HY", status: "active", region: "as" },
            { name: "אוסטריאן איירליינס", nameEn: "Austrian Airlines", iata: "OS", status: "active", region: "we_eu" },
            { name: "אזימוט", nameEn: "Azimuth", iata: "A4", status: "active", region: "as" },
            { name: "אזרבייג׳ן איירליינס", nameEn: "Azerbaijan Airlines", iata: "J2", status: "active", region: "as" },
            { name: "איטה (ITA)", nameEn: "ITA Airways", iata: "AZ", status: "active", region: "we_eu" },
            { name: "אייר אירופה", nameEn: "Air Europa", iata: "UX", status: "active", region: "we_eu" },
            { name: "אייר בלטיק", nameEn: "airBaltic", iata: "BT", status: "active", region: "ee_ba" },

            { name: "רויאל אייר מארוק", nameEn: "Royal Air Maroc", iata: "AT", status: "inactive", region: "me_af" },

            { name: "ריינאייר", nameEn: "Ryanair", iata: "FR", status: "inactive", region: "we_eu" }
        ];

        const TODAY = new Date(CONFIG.todayISO + 'T00:00:00');
        TODAY.setHours(0, 0, 0, 0);

        // הוספת פונקציה לניקוי קלט HTML כדי למנוע פרצות אבטחה (XSS)
        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag]));
        }

        function calculateDaysUntil(dateString) {
            if (!dateString) return null;
            const targetDate = new Date(dateString + 'T00:00:00');
            targetDate.setHours(0, 0, 0, 0);
            return Math.ceil((targetDate - TODAY) / (1000 * 60 * 60 * 24));
        }

        function formatDateStr(dateString) {
            if (!dateString) return '';
            const parts = dateString.split('-');
            return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }

        function resolveStatus(airline) {
            const strings = I18N[currentLang];
            if (airline.status === 'active') return { theme: 'active', text: strings.statusActive, isLive: true };
            if (airline.status === 'active_haifa') return { theme: 'active', text: strings.statusActiveHaifa, isLive: true };

            const diffDays = calculateDaysUntil(airline.until);
            const dateFormatted = formatDateStr(airline.until);

            if (diffDays === null) return { theme: 'inactive', text: strings.statusSuspended, isLive: false };
            if (diffDays < 0) return { theme: 'suspended', text: strings.statusSuspended, isLive: false };
            if (diffDays === 0) return { theme: 'soon', text: strings.statusToday, isLive: false };
            if (diffDays === 1) return { theme: 'soon', text: strings.statusTomorrow, isLive: false };
            if (diffDays <= 14 || airline.status === 'soon') return { theme: 'soon', text: `${strings.statusResumeIn}${dateFormatted}`, isLive: false };

            if (airline.status === 'inactive') return { theme: 'inactive', text: `${strings.statusExpectedIn}${dateFormatted}`, isLive: false };
            return { theme: 'suspended', text: `${strings.statusSuspendedUntil}${dateFormatted}`, isLive: false };
        }

        function createCardHTML(airline) {
            const st = resolveStatus(airline);
            const themeClass = 'theme-' + st.theme;
            const iconClass = { active: 'fa-circle-check', soon: 'fa-clock', suspended: 'fa-circle-pause', inactive: 'fa-circle-minus' }[st.theme];

            // שימוש בפונקציית האבטחה
            let iataText = escapeHTML(airline.iata && airline.iata !== "???" ? airline.iata : "--");
            let nameToDisplay = escapeHTML(currentLang === 'en' ? airline.nameEn : airline.name);
            
            const strings = I18N[currentLang];
            const searchVal = currentSearch.trim();

            if (searchVal) {
                const escapedSearch = searchVal.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const safeSearchVal = escapeHTML(escapedSearch); // יש צורך לנקות גם את המחרוזת של המשתמש
                const regex = new RegExp(`(${safeSearchVal})`, 'gi');
                nameToDisplay = nameToDisplay.replace(regex, '<mark>$1</mark>');
                if (iataText !== '--') {
                    iataText = iataText.replace(regex, '<mark>$1</mark>');
                }
            }

            const badgeLeading = st.isLive ? '<span class="status-pulse"></span>' : `<i class="fa-solid ${iconClass} status-icon"></i>`;

            let logoHtml;
            const cleanIataText = escapeHTML(airline.iata && airline.iata !== "???" ? airline.iata : "--");
            
            // הוספת loading="lazy" לכל התמונות לצורך שיפור ביצועים
            if (airline.customLogo) {
                logoHtml = `<img src="${escapeHTML(airline.customLogo)}" class="airline-real-logo" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><div class="airline-logo-fallback" style="display: none;">${cleanIataText}</div>`;
            } else if (airline.iata && airline.iata !== "???") {
                logoHtml = `<img src="https://pics.avs.io/200/200/${escapeHTML(airline.iata)}.png" class="airline-real-logo" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><div class="airline-logo-fallback" style="display: none;">${cleanIataText}</div>`;
            } else {
                logoHtml = `<div class="airline-logo-fallback">${iataText}</div>`;
            }

            return `
                <article class="airline-card ${themeClass}">
                    <div class="card-header">
                        <div class="airline-logo-container">${logoHtml}</div>
                        <div class="airline-info">
                            <h3>${nameToDisplay}</h3>
                            <p><i class="fa-solid fa-plane"></i> ${strings.airlineCode} ${iataText}</p>
                        </div>
                    </div>
                    <div class="status-badge">
                        ${badgeLeading}
                        <span class="status-text">${st.text}</span>
                    </div>
                </article>
            `;
        }

        function sortAirlinesWithinGroup(a, b) {
            return currentLang === 'en' ? a.nameEn.localeCompare(b.nameEn, 'en') : a.name.localeCompare(b.name, 'he');
        }

        function renderAirlines(airlinesToRender) {
            const container = document.getElementById('dashboardContainer');
            const noResults = document.getElementById('noResults');

            // שמירה על תוצאות ה"לא נמצאו" ומחיקת השאר כדי להכין לרינדור חדש
            Array.from(container.children).forEach(child => { if (child.id !== 'noResults') child.remove(); });
            
            if (airlinesToRender.length > 0) {
                // שימוש ב-DocumentFragment לשיפור ביצועי ה-DOM (פעולת צביעה אחת במקום כמה עשרות)
                const fragment = document.createDocumentFragment();

                const returningSoon = airlinesToRender.filter(a => {
                    if (a.status === 'active' || a.status === 'active_haifa') return false;
                    const diff = calculateDaysUntil(a.until);
                    return diff !== null && diff >= 0 && diff <= 7;
                });

                const returningNames = new Set(returningSoon.map(a => a.name));

                if (returningSoon.length > 0) {
                    returningSoon.sort(sortAirlinesWithinGroup);
                    const section = document.createElement('div');
                    section.className = 'alliance-section highlight-section';
                    
                    section.innerHTML = `
                        <h2 class="alliance-title">
                            <i class="fa-solid fa-bolt"></i> ${escapeHTML(I18N[currentLang].returningThisWeek)}
                        </h2>
                        <div class="dashboard-list">${returningSoon.map(createCardHTML).join('')}</div>
                    `;
                    fragment.appendChild(section);
                }

                REGION_GROUPS.forEach(group => {
                    const groupAirlines = airlinesToRender.filter(a => a.region === group.id && !returningNames.has(a.name));
                    if (groupAirlines.length === 0) return;

                    groupAirlines.sort(sortAirlinesWithinGroup);

                    const section = document.createElement('div');
                    section.className = 'alliance-section';

                    section.innerHTML = `
                        <h2 class="alliance-title">${escapeHTML(currentLang === 'en' ? group.titleEn : group.title)}</h2>
                        <div class="dashboard-list">${groupAirlines.map(createCardHTML).join('')}</div>
                    `;
                    fragment.appendChild(section);
                });
                
                // הוספה יעילה וחלקה של כל הרכיבים יחד
                container.insertBefore(fragment, noResults);
                noResults.style.display = 'none';
            } else {
                noResults.style.display = 'block';
            }
        }

        let currentFilter = 'all';
        let currentSearch = '';

        function getFilteredAirlines() {
            const searchLower = currentSearch.trim().toLowerCase();
            return AIRLINES.filter(airline => {
                const matchesSearch = !searchLower || airline.name.toLowerCase().includes(searchLower) || (airline.nameEn && airline.nameEn.toLowerCase().includes(searchLower)) || airline.iata.toLowerCase().includes(searchLower);
                const effectiveStatus = (airline.status === 'active' || airline.status === 'active_haifa') ? 'active' : 'suspended';
                const matchesFilter = currentFilter === 'all' || effectiveStatus === currentFilter;
                return matchesSearch && matchesFilter;
            });
        }

        function applyFilters() { renderAirlines(getFilteredAirlines()); }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('subtitleText').innerText = I18N.he.subtitle;

            const searchInput = document.getElementById('searchInput');
            let t;
            searchInput.addEventListener('input', (e) => {
                currentSearch = e.target.value;
                clearTimeout(t);
                t = setTimeout(() => {
                    applyFilters();
                    if (currentSearch.trim() !== '') {
                        trackEvent('search', { search_term: currentSearch.trim() });
                    }
                }, 500);
            });

            const filterBtns = document.querySelectorAll('.filter-btn');
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.getAttribute('data-filter');
                    applyFilters();
                    trackEvent('filter_used', { filter_type: currentFilter });
                });
            });

            applyFilters();
        });
    </script>
